name: factoryflow
version: "1.0.0"
config-version: 2

profile: factoryflow

model-paths: ["models"]
clean-targets: ["target", "dbt_packages"]

models:
  factoryflow:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
