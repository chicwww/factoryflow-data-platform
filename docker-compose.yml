services:
  postgres:
    image: postgres:16
    container_name: factoryflow-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-factoryflow}
      POSTGRES_USER: ${POSTGRES_USER:-factoryflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_locally}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - factoryflow-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-factoryflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

# Airflow and other services will be added in a later phase (Phase 4),
# to keep each phase reviewable and testable on its own.

volumes:
  factoryflow-pgdata:
